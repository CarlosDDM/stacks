services:
  postgres:
    container_name: postgres-zabbix
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: zabbix
    networks:
      - zabbix-monit
    volumes:
      - /data/zabbix/postgres:/var/lib/postgresql/data
    restart: always

  zabbix-server:
    image: zabbix/zabbix-server-pgsql:7.0-ubuntu-latest
    container_name: zabbix-server
    environment:
      DB_SERVER_HOST: postgres-zabbix
      DB_SERVER_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: zabbix
    networks:
      - zabbix-monit
    volumes:
      - /data/zabbix/server/alertscripts:/usr/lib/zabbix/alertscripts
      - /data/zabbix/server/externalscripts:/usr/lib/zabbix/externalscripts
      - /data/zabbix/server/modules:/var/lib/zabbix/modules
      - /data/zabbix/server/ssh_keys:/var/lib/zabbix/ssh_keys
      - /data/zabbix/server/snmptraps:/var/lib/zabbix/snmptraps
    depends_on:
      - postgres
    restart: always

  zabbix-agent:
    image: zabbix/zabbix-agent:7.0-ubuntu-latest
    container_name: zabbix-agent
    environment:
      ZBX_HOSTNAME: zabbix-agent
      ZBX_SERVER_HOST: zabbix-server
    networks:
      - zabbix-monit
    depends_on:
      - zabbix-server
    restart: always

  zabbix-web:
    image: zabbix/zabbix-web-nginx-pgsql:7.0-ubuntu-latest
    container_name: zabbix-web
    environment:
      ZBX_SERVER_HOST: zabbix-server
      ZBX_SERVER_PORT: 10051
      DB_SERVER_HOST: postgres-zabbix
      DB_SERVER_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: zabbix
      PHP_TZ: America/Sao_Paulo
    networks:
      - zabbix-monit
    ports:
      - 8080:8080
    depends_on:
      - postgres
      - zabbix-server
    restart: always

networks:
  zabbix-monit:
    driver: bridge
